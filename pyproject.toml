[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-image-synthesis-texture-tasks"
version = "3.0.0"
description = "Synthetic paired 2D texture and layout task generation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
